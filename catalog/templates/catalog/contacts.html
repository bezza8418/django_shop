{% extends 'catalog/base.html' %}

{% block title %}Контакты - Django Shop{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <h2>Свяжитесь с нами</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Сообщение</label>
                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </div>
    <div class="col-md-6">
        <h2>Наши контакты</h2>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Адрес:</h5>
                <p class="card-text">г. Москва, ул. Примерная, д. 123</p>
                <h5 class="card-title mt-3">Телефон:</h5>
                <p class="card-text">+7 (999) 123-45-67</p>
                <h5 class="card-title mt-3">Email:</h5>
                <p class="card-text">info@djangoshop.ru</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
